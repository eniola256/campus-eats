    <meta charset="UTF-8" />

    <title>Campus Eats</title>

    <!-- Google Fonts — a broad test set across styles (serif, sans-serif,
         display, mono) so you can freely swap font-family in CSS without
         needing to edit this link each time. Trim this down to just the
         2-3 you actually keep before going live — loading 15+ font
         families is fine for testing, but adds real page-load weight. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700;900&family=DM+Serif+Display&family=Libre+Caslon+Display&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols — Google's icon font, used for the mobile
         bottom tab bar icons (Menu / Cart / Orders). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
  </head>
